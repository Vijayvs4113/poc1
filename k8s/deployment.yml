apiVersion: apps/v1
kind: Deployment

metadata:
  name: static-website

spec:
  replicas: 2

  selector:
    matchLabels:
      app: static-website

  template:
    metadata:
      labels:
        app: static-website

    spec:
      containers:
        - name: website
          image: vijayvs6383/static-website:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80